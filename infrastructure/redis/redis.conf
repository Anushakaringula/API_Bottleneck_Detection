# Redis configuration for the experiment lab. In-memory only: every run starts from an
# empty cache (scripts/lab-reset.sh), and persistence would add disk work to some runs.
# Note: Redis does not allow comments at the end of a line; keep them on their own lines.

# Inside the container; the host port is bound to 127.0.0.1 in docker-compose.yml.
bind 0.0.0.0
port 6379
protected-mode no
# Local-only lab value, not a secret.
requirepass labpass

save ""
appendonly no

maxmemory 256mb
maxmemory-policy allkeys-lru

loglevel warning
