name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: target-api/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python packages (diagnosis)
        run: python -m pip install -r requirements.txt
      - name: Install target-api dependencies
        run: npm ci
        working-directory: target-api
      # verify-legacy.sh is not run here: the frozen legacy data is not in git.
      - name: Run all test suites
        run: scripts/test-all.sh
