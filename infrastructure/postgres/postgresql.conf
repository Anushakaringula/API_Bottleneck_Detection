# PostgreSQL configuration for the experiment lab. Settings not listed keep their
# built-in defaults. Chosen for repeatable measurements, not for production.

listen_addresses = '*'            # inside the container; the host port is bound to 127.0.0.1
max_connections = 100

# Memory: fixed, and well inside the container's 2 GB limit.
shared_buffers = 512MB
effective_cache_size = 1GB
work_mem = 8MB
maintenance_work_mem = 256MB

# Planner: SSD-like storage. JIT compilation and parallel query are off because they add
# run-to-run latency variance.
random_page_cost = 1.1
jit = off
# No parallel query: parallel workers compete with concurrent requests for the container's
# 2 CPUs, so a query's speed would depend on what else is running.
max_parallel_workers_per_gather = 0

# No background work that could start in the middle of a run. Statistics are
# refreshed explicitly (VACUUM ANALYZE) after seeding instead.
autovacuum = off

# Database-side ground truth for checking that injected faults are active.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 10000
track_io_timing = on

# Logging: errors only, so logging cost does not differ between conditions.
log_min_messages = warning
log_min_error_statement = error
log_timezone = 'UTC'
timezone = 'UTC'
